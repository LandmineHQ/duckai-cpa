# ---------------------------------------------------------------------------
# DuckAI CPA — run the prebuilt GHCR image with Compose.
#
#   DUCKAI_CPA_VERSION=latest docker compose -f docker-compose.ghcr.yml up -d
#
# Pin a published version explicitly; the value is also used as the image tag.
# Mount a persistent data volume and set a strong admin token before exposing
# this service beyond localhost.
#
# Linux bind-mount note: the image runs as UID/GID 1000:1000. If ./data is
# missing, Docker creates it as root and the container fails with EACCES.
# Prepare it first:
#   mkdir -p data && sudo chown -R 1000:1000 data
# ---------------------------------------------------------------------------

services:
  duckai-cpa:
    image: ghcr.io/landminehq/duckai-cpa:${DUCKAI_CPA_VERSION:-latest}
    container_name: duckai-cpa
    restart: unless-stopped

    ports:
      - "8787:8787"

    environment:
      DUCKAI_CPA_HOST: "0.0.0.0"
      DUCKAI_CPA_PORT: "8787"
      DUCKAI_CPA_DATA_DIR: "/app/data"
      DUCKAI_CPA_ADMIN_TOKEN: "${DUCKAI_CPA_ADMIN_TOKEN:-change-me-to-a-strong-random-admin-token}"
      DUCKAI_CPA_VERSION: "${DUCKAI_CPA_VERSION:-latest}"
      NODE_ENV: "production"

    volumes:
      - ./data:/app/data

    stop_grace_period: 15s

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const p=process.env.DUCKAI_CPA_PORT||'8787';fetch('http://127.0.0.1:'+p+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
