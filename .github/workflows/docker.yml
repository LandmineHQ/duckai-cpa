name: docker

# Manual only: publish an existing build artifact to GHCR.
# 1. Open the latest successful "build" workflow run and copy its run id.
# 2. Run this workflow with a version (for example v0.1.0) and that run id.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version/tag (for example v0.1.0)"
        required: true
        type: string
      run_id:
        description: "Successful build workflow run id (artifact duckai-cpa-release)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          # Docker tag rule: start alphanumeric/underscore, then letters/digits/._-
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::invalid version/tag '$VERSION'. Use letters, digits, '.', '_' or '-', start with a letter/digit/underscore, max 128 chars (examples: v0.1.0, beta.0.0.1, v1.0.0-beta.1)."
            exit 1
          fi
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::run_id must be a numeric GitHub Actions run id"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: duckai-cpa-release
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      - name: Extract release artifact
        shell: bash
        run: |
          test -f duckai-cpa-release.tar.gz
          tar -xzf duckai-cpa-release.tar.gz
          test -f release/src/index.js
          test -f release/web/index.html
          du -sh release

      - name: Read artifact package version
        id: package_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./release/package.json').version")
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Compute lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.release
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ inputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish summary
        shell: bash
        run: |
          {
            echo "### Published image"
            echo ""
            echo "- image: \`${{ steps.image.outputs.name }}:${{ inputs.version }}\`"
            echo "- source build run id: \`${{ inputs.run_id }}\`"
            echo "- artifact package version: \`${{ steps.package_version.outputs.value }}\`"
            echo "- revision: \`${{ github.sha }}\`"
            echo "- platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
