name: release-ghcr

# Manual only: publish an existing build artifact to GHCR.
# Inputs are intentionally limited to the image target so this workflow cannot
# be confused with the GitHub Release workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version/tag (required; e.g. v0.1.0 or beta.0.0.1)"
        required: true
        type: string
      run_id:
        description: "Successful build workflow run id (artifact duckai-cpa-release)"
        required: true
        type: string
      also_latest:
        description: "Also push the :latest tag after the versioned image"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: release-ghcr-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  ghcr:
    permissions:
      contents: read
      packages: write
      actions: read
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ inputs.version }}
      also_latest: ${{ inputs.also_latest }}
      run_id: ${{ inputs.run_id }}
