name: build

# Runs on every push: builds the admin console, trims dev dependencies and
# uploads a reproducible release artifact (backend + production node_modules +
# prebuilt web). Docker publishing is a separate manual workflow.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build admin console
        run: npm run build:web

      # Backend is plain ESM JavaScript: there is no native compile step.
      # Pruning dev dependencies gives the runtime artifact its smallest
      # practical dependency tree without bundling jsdom/undici (which rely on
      # dynamic require/assets and do not bundle safely).
      - name: Trim to production dependencies
        run: npm prune --omit=dev

      - name: Assemble release tree
        shell: bash
        run: |
          rm -rf release
          mkdir -p release
          cp -R src release/src
          cp -R web release/web
          cp -R config release/config
          cp package.json release/package.json
          cp package-lock.json release/package-lock.json
          cp -R node_modules release/node_modules
          rm -rf release/node_modules/.bin release/node_modules/.cache
          find release/node_modules -type f \( -name '*.md' -o -name '*.markdown' -o -name '*.map' -o -name '*.ts' -o -name '*.d.ts' \) -delete
          test -f release/src/index.js
          test -f release/web/index.html
          node --check release/src/index.js

      - name: Create artifact archive
        shell: bash
        run: |
          tar -czf duckai-cpa-release.tar.gz release
          ls -lh duckai-cpa-release.tar.gz

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: duckai-cpa-release
          path: duckai-cpa-release.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Build summary
        shell: bash
        run: |
          {
            echo "### Build artifact"
            echo ""
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- ref: \`${GITHUB_REF}\`"
            echo "- run id: \`${GITHUB_RUN_ID}\`"
            echo "- package version: \`${{ steps.version.outputs.value }}\`"
            echo "- artifact: \`duckai-cpa-release\` (retention 30 days)"
            echo ""
            echo "| path | size |"
            echo "| --- | --- |"
            echo "| release | $(du -sh release | cut -f1) |"
            echo "| release/node_modules (pruned) | $(du -sh release/node_modules | cut -f1) |"
            echo "| release/web | $(du -sh release/web | cut -f1) |"
            echo "| archive | $(du -h duckai-cpa-release.tar.gz | cut -f1) |"
            echo ""
            echo "Use this run id in the manual **docker** workflow together with a version."
          } >> "$GITHUB_STEP_SUMMARY"
