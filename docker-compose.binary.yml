# ---------------------------------------------------------------------------
# DuckAI CPA — 极简二进制镜像部署（Dockerfile.binary）
#
#   docker compose -f docker-compose.binary.yml up -d --build
#   docker compose -f docker-compose.binary.yml logs -f
#   # 首次启动会打印 adminToken 与默认 API Key；浏览器打开 http://127.0.0.1:8787/admin/
#
# 与 docker-compose.yml（Node 服务）的区别：
#   - 镜像内没有 Node.js / node_modules，只有 Alpine + 单文件 musl 二进制；
#   - 数据卷挂到 /data；
#   - 需要中文 PDF 上下文时用 INSTALL_CJK_FONTS=true 重新构建（+16MB）。
# ---------------------------------------------------------------------------

services:
  duckai-cpa:
    build:
      context: .
      dockerfile: Dockerfile.binary
      args:
        APP_VERSION: ${DUCKAI_CPA_VERSION:-0.1.0}
        INSTALL_CJK_FONTS: ${INSTALL_CJK_FONTS:-false}
    image: duckai-cpa:binary-${DUCKAI_CPA_VERSION:-0.1.0}
    container_name: duckai-cpa-binary
    restart: unless-stopped

    ports:
      - "8787:8787"

    environment:
      DUCKAI_CPA_HOST: "0.0.0.0"
      DUCKAI_CPA_PORT: "8787"
      DUCKAI_CPA_DATA_DIR: "/data"
      # 强烈建议替换为强随机串；留空/删除则用 data/config.json 里首次生成的 token
      DUCKAI_CPA_ADMIN_TOKEN: "${DUCKAI_CPA_ADMIN_TOKEN:-}"

    volumes:
      - duckai-cpa-binary-data:/data

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - "http://127.0.0.1:8787/healthz"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

    # 给进行中的 SSE 流与原子写留时间
    stop_grace_period: 15s

volumes:
  duckai-cpa-binary-data:
