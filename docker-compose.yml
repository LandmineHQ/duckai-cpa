# ---------------------------------------------------------------------------
# DuckAI CPA — docker compose 部署
#
#   # 0) 先在本机构建控制台（镜像只复制预构建产物 web/）
#   npm install && npm run build:web
#   # 1) 启动
#   docker compose up -d --build
#   docker compose logs -f duckai-cpa     # 首次启动会打印一次 adminToken 与默认 API Key
#   浏览器打开 http://127.0.0.1:8787/admin
#
# 数据卷说明：
#   - 默认挂载 ./data 到 /app/data（保留 config.json / keys.json / logs.json /
#     stats.json / identity*.json / testsessions.json / pairing.json 等运行数据）
#   - config/config.example.json 已打进镜像，作为「恢复默认配置」的基线；
#     实际运行配置写入 data/config.json（在 data 卷内），因此只需挂载 data/
#   - Linux 宿主机若出现 Permission denied，先执行：
#       mkdir -p data && sudo chown -R 1000:1000 data
#   - 也可改用下方注释掉的命名卷（首次会自动继承镜像内 node 属主）
# ---------------------------------------------------------------------------

services:
  duckai-cpa:
    build:
      context: .
      dockerfile: Dockerfile
    image: duckai-cpa:0.1.0
    container_name: duckai-cpa
    restart: unless-stopped

    ports:
      - "8787:8787"

    environment:
      # 容器内必须监听 0.0.0.0
      DUCKAI_CPA_HOST: "0.0.0.0"
      DUCKAI_CPA_PORT: "8787"
      DUCKAI_CPA_DATA_DIR: "/app/data"
      # 管理后台 token：强烈建议替换为强随机串（不要提交真实值到仓库）
      # 留空/删除本行则使用 data/config.json 中首次启动自动生成的值
      DUCKAI_CPA_ADMIN_TOKEN: "change-me-to-a-strong-random-admin-token"
      NODE_ENV: "production"

    volumes:
      - ./data:/app/data
      # 备选（跨平台更省心）：命名卷，注释 bind mount 后启用
      # - duckai-cpa-data:/app/data

    # 优雅停止：给进行中的 SSE 流与原子写留时间
    stop_grace_period: 15s

    healthcheck:
      # /healthz 公开且即使上游异常也返回 200（body.upstream.ok=false），
      # 这里只判断网关进程可响应，避免上游波动导致容器反复重启；
      # start_period 与 Dockerfile 的 HEALTHCHECK 保持一致（60s，容忍启动时挑战预热）。
      test:
        - CMD
        - node
        - -e
        - "const p=process.env.DUCKAI_CPA_PORT||'8787';fetch('http://127.0.0.1:'+p+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

